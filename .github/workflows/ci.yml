name: LIRA CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install ruamel.yaml pytest pytest-cov
      - run: pip install -e python/
      - name: Run Python tests (unit, integration, coverage)
        run: bash tests/scripts/python.sh

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y z3
      - run: pip install ruamel.yaml
      - name: Run Rust tests (integration, with coverage)
        run: bash tests/scripts/rust.sh

  cross-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install ruamel.yaml pytest

      - name: Python writes native YAML
        run: pytest tests/cross_language/test_cross.py -k "write" -v
      - name: Rust writes native YAML
        run: cd rust && cargo test -p lira-tests --test cross_language test_rust_write_and_self_read

      - name: Python reads Rust
        run: pytest tests/cross_language/test_cross.py -k "reads" -v
      - name: Rust reads Python
        run: cd rust && cargo test -p lira-tests --test cross_language test_rust_reads
