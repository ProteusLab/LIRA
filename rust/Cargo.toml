[workspace]
resolver = "3"

members = ["lira", "tests", "copy"]

[workspace.dependencies]
anyhow = "1.0.102"
log = "0.4.29"
env_logger = "0.11.10"
clap = "4.6.1"
ahash = "0.8.12"
regex = "1.12.3"
serde = "1.0.228"
serde_yaml = "0.8"
egglog-core-relations = { git = "https://github.com/egraphs-good/egglog.git", rev = "8879605cafad303db25787406163a7e5bc845f5d" }

[profile.work]
inherits = "dev"
opt-level = 2

[profile.optimize]
inherits = "release"
lto = "thin"
