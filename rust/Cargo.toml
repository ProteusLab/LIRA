[workspace]
resolver = "3"

members = ["lira", "lira_trs", "lira_opt", "tests", "copy"]

[workspace.dependencies]
anyhow = "1.0.102"
log = "0.4.29"
env_logger = "0.11.10"
clap = "4.6.1"
ahash = "0.8.12"
regex = "1.12.3"
serde = "1.0.228"
serde_yaml = "0.8"
rayon = "1.12.0"
dateg = { git = "https://github.com/belovdv/dateg.git", rev = "abad7b4ce1e677515781306575a11930b6bfd9c4" }
dateg_extractors = { git = "https://github.com/belovdv/dateg.git", rev = "abad7b4ce1e677515781306575a11930b6bfd9c4" }

[profile.work]
inherits = "dev"
opt-level = 2

[profile.optimize]
inherits = "release"
lto = "thin"
